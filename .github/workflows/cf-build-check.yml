name: Cloudflare Build Check

# 模擬 Cloudflare Pages 的建置流程，讓沒有 Cloudflare 權限的人也能在 GitHub 上看到錯誤紀錄
on:
  push:
    branches:
      - redesign-life-notes
  workflow_dispatch:

jobs:
  next-on-pages:
    name: next-on-pages (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18.17.1", "20", "22"]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build with next-on-pages
        run: npx -y @cloudflare/next-on-pages@1
