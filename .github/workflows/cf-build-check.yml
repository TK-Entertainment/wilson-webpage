name: Cloudflare Build Check

# 模擬 Cloudflare Pages 的建置流程，讓沒有 Cloudflare 權限的人也能在 GitHub 上看到錯誤紀錄
on:
  push:
    branches:
      - redesign-life-notes
  workflow_dispatch:

jobs:
  next-on-pages:
    name: next-on-pages (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Next 15 需要 Node 18.18 以上；Cloudflare 會照 .nvmrc 的版本建置
        node: [".nvmrc", "20", "22"]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node != '.nvmrc' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == '.nvmrc' && '.nvmrc' || '' }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile 2>&1 | tee install.log; exit ${PIPESTATUS[0]}

      - name: Build with next-on-pages
        run: npx -y @cloudflare/next-on-pages@1 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # 把錯誤紀錄最後一段寫成 annotation，不用登入 GitHub 也能透過 API 讀到
      - name: Report failure log
        if: failure()
        run: |
          for f in install.log build.log; do
            [ -f "$f" ] || continue
            grep -v "Invalid prerender config" "$f" | tail -n 30 | sed 's/\x1b\[[0-9;]*m//g' > tail.txt
            body=$(awk '{printf "%s%%0A", $0}' tail.txt)
            echo "::error title=$f::${body}"
          done
